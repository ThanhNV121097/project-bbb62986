<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hello-word-17</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    main {
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.04em;
    }
  </style>
</head>
<body>
  <main aria-label="Hello Word page">
    <h1>Hello Word</h1>
  </main>
</body>
</html>
